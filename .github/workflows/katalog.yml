name: Aktualizace akčního katalogu

on:
  # automatické denní spouštění je vypnuté – katalog se aktualizuje ručně (příloha PDF)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  katalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nástroje
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pip install -q pillow
      - name: Zkontrolovat katalog
        id: k
        run: python3 tools/update_katalog.py
      - name: Uložit změny
        if: steps.k.outputs.changed == 'true'
        run: |
          git config user.name "katalog-bot"
          git config user.email "katalog-bot@users.noreply.github.com"
          git add -A
          git commit -m "Aktualizace akčního katalogu (${{ steps.k.outputs.label }}, ${{ steps.k.outputs.pages }} stran)"
          git push
      - name: Upozornit na kontrolu cen a modelů
        if: steps.k.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.k.outputs.label }}
          PAGES: ${{ steps.k.outputs.pages }}
          URL: ${{ steps.k.outputs.url }}
        run: |
          gh issue create --title "Nový akční katalog $LABEL – zkontrolovat ceny a modely" \
            --body "Bot stáhl nový katalog ($PAGES stran) z $URL a aktualizoval listování a PDF ke stažení. Karty na stránce Dveře do interiéru (ceny, modely, čísla stran) se automaticky NEMĚNÍ, je potřeba je ručně porovnat s novým katalogem."
